# NocturneMapper Configuration File
# Unknown runtime addresses, offsets, and custom carrier parameters are exposed here.
# Set any symbol RVA to non-zero to override automatic signature scanning.

carrier.name = ene.sys
carrier.serviceName = EneTechIo
carrier.deviceLink = \\.\EneIo
carrier.ioctlMapPhys = 0x80102040
carrier.ioctlUnmapPhys = 0x80102044
