symbols.rvaKernelHashBucketList = 0x0
symbols.rvaHashCacheLock = 0x0
symbols.rvaMmAllocateIndependentPagesEx = 0x0
symbols.rvaMiGetPteAddress = 0x0
symbols.explicitSystemCr3 = 0x0
symbols.syscallHookExport = NtAddAtom

mapper.useIndependentPages = 1
mapper.scrubHeaders = 1
mapper.scrubTelemetry = 1
